name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas>=2.0.0
        pip install numpy>=1.24.0

    - name: Build static site bundle
      run: |
        python scripts/static_analysis_optimized.py
        python scripts/sync_site_assets.py
        touch site/.nojekyll
        echo "Hub: site/index.html (not overwritten). Optimized CI rankings: site/arc_analysis_optimized.html"
        ls -la site/index.html site/arc_analysis_optimized.html
        du -h site/arc_analysis_optimized.html

    - name: Note lead-citation CSVs for Pages
      run: |
        for f in \
          data/discovery/arc_discovery_projects_2010_2026_with_for_lead_citations.csv \
          data/fellowship/arc_fellowships_lead_citations.csv; do
          if [ ! -f "$f" ]; then
            echo "::warning::Missing $f in the repo — sync could not copy it into site/. The lead citations chart may fail or show DP-only until you commit these files (build with scripts/lead_ci_citations_openalex.py then git add)."
          fi
        done
        if [ -f site/arc_discovery_projects_2010_2026_with_for_lead_citations.csv ]; then
          echo "Lead citations Discovery CSV present in site bundle."
        fi
        if [ -f site/arc_fellowships_lead_citations.csv ]; then
          echo "Lead citations fellowship CSV present in site bundle."
        fi

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: site
        publish_branch: gh-pages
        force_orphan: true
        destination_dir: ./
