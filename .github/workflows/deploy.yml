name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2.0.0" "numpy>=1.24.0"

      - name: Build static site bundle
        run: |
          python scripts/static_analysis_optimized.py
          python scripts/generate_grant_summaries.py
          python scripts/sync_site_assets.py
          R="${GITHUB_RUN_NUMBER}"
          sed -i.bak "s/__GITHUB_RUN_NUMBER__/${R}/g" site/lead_ci_citations_visualization.html site/index.html
          rm -f site/lead_ci_citations_visualization.html.bak site/index.html.bak
          touch site/.nojekyll
          echo "Hub: site/index.html | lead viz: site/lead_ci_citations_visualization.html"
          ls -la site/index.html site/arc_analysis_optimized.html site/lead_ci_citations_visualization.html

      - name: Note lead-citation CSVs for Pages
        run: |
          for f in \
            data/discovery/arc_discovery_projects_2010_2026_with_for_lead_citations.csv \
            data/fellowship/arc_fellowships_lead_citations.csv; do
            if [ ! -f "$f" ]; then
              echo "::warning::Missing $f in the repo — sync could not copy it into site/. The lead citations chart may fail or show DP-only until you commit these files."
            fi
          done
          if [ -f site/arc_discovery_projects_2010_2026_with_for_lead_citations.csv ]; then
            echo "Lead citations Discovery CSV present in site bundle."
          fi
          if [ -f site/arc_fellowships_lead_citations.csv ]; then
            echo "Lead citations fellowship CSV present in site bundle."
          fi
          if [ ! -f site/grant_summaries.json ]; then
            echo "::error::site/grant_summaries.json missing after build — run generate_grant_summaries.py and ensure discovery/fellowship JSON exist in repo."
            exit 1
          fi
          echo "grant_summaries.json present ($(wc -c < site/grant_summaries.json) bytes)."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
